# One messagebus.ai runner. See README.md in this folder for the keys and the steps.
# Put one file per key in ./secrets (mbus_api_key, anthropic_api_key or claude_code_oauth_token,
# openai_api_key) and run: docker compose up -d
# To build the image from this checkout instead, replace "image:" with
#   build: { context: ../.., dockerfile: docker/runner/Dockerfile }
name: messagebus-runner

services:
  runner:
    image: ghcr.io/unifinity-software/messagebus-runner:1.5.2
    platform: linux/amd64
    restart: unless-stopped
    environment:
      MBUS_SERVER: ${MBUS_SERVER:-https://app.messagebus.ai}
      MBUS_MACHINE_NAME: ${MBUS_MACHINE_NAME:-docker-runner}
    volumes:
      - ./secrets:/run/secrets:ro
      # The runner's machine key, agent sign-ins and checked-out code survive a restart.
      - runner-home:/home/runner

volumes:
  runner-home:
